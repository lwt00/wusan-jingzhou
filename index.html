<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>雾散荆州 · 清气行动</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand-lockup">
        <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
        <div>
          <p class="kicker">JINGZHOU · AIR ACTION</p>
          <h1>雾散荆州</h1>
        </div>
      </div>
      <div class="session-chip"><span class="live-dot"></span><span id="phaseLabel">净化行动进行中</span></div>
    </header>

    <section class="hero-copy">
      <div>
        <p class="eyebrow">四站清风路线</p>
        <h2>从一处景点出发，<br><em>让荆州逐站清晰。</em></h2>
        <p class="intro">先在地图上选择当前景点，再进入放大后的关卡场景。移动清气核心，吸附并分解雾霾颗粒。</p>
      </div>
      <div class="stat-block" aria-live="polite">
        <div class="stat-label">当前关卡污染指数</div>
        <div class="stat-number" id="pollutionValue">100</div>
        <div class="status-line"><span id="airStatus">重度污染</span><span class="status-separator">/</span><span>目标 ≤ 20</span></div>
        <div class="meter"><span id="pollutionMeter"></span></div>
      </div>
    </section>

    <section class="playfield-wrap">
      <div class="playfield" id="playfield" tabindex="0" aria-label="荆州四站清雾地图">
        <div class="map-scene active" id="mapScene" aria-label="荆州地图总览">
          <div class="map-mist" aria-hidden="true"></div>
          <div class="cleared-zone" data-level="0" style="--x:25%;--y:25%;--w:52%;--h:52%;" aria-hidden="true"></div>
          <div class="cleared-zone" data-level="1" style="--x:25%;--y:75%;--w:52%;--h:52%;" aria-hidden="true"></div>
          <div class="cleared-zone" data-level="2" style="--x:75%;--y:75%;--w:52%;--h:52%;" aria-hidden="true"></div>
          <div class="cleared-zone" data-level="3" style="--x:75%;--y:25%;--w:52%;--h:52%;" aria-hidden="true"></div>
          <div class="cleared-seam" data-level-a="0" data-level-b="1" data-seam="left-horizontal" aria-hidden="true"></div>
          <div class="cleared-seam" data-level-a="1" data-level-b="2" data-seam="bottom-vertical" aria-hidden="true"></div>
          <div class="cleared-seam" data-level-a="0" data-level-b="3" data-seam="top-vertical" aria-hidden="true"></div>
          <div class="cleared-seam" data-level-a="2" data-level-b="3" data-seam="right-horizontal" aria-hidden="true"></div>
          <button class="map-marker available" data-level="0" style="--x:18%;--y:12%;" aria-label="进入关羽祠">
            <span class="marker-pin">●</span><span class="marker-label">关羽祠</span><span class="marker-status">当前关卡</span>
          </button>
          <button class="map-marker locked" data-level="1" style="--x:48%;--y:44%;" aria-label="宾阳楼，未解锁">
            <span class="marker-pin">●</span><span class="marker-label">宾阳楼</span><span class="marker-status">未解锁</span>
          </button>
          <button class="map-marker locked" data-level="2" style="--x:82%;--y:45%;" aria-label="张居正故居，未解锁">
            <span class="marker-pin">●</span><span class="marker-label">张居正故居</span><span class="marker-status">未解锁</span>
          </button>
          <button class="map-marker locked" data-level="3" style="--x:53%;--y:12%;" aria-label="荆州大学城，未解锁">
            <span class="marker-pin">●</span><span class="marker-label">荆州大学城</span><span class="marker-status">未解锁</span>
          </button>
          <div class="map-instruction">选择当前标记，进入景点关卡</div>
        </div>
        <div class="level-scene" id="levelScene" aria-hidden="true">
          <div class="level-header"><span id="levelNumber">01 / 04</span><strong id="levelTitle">关羽祠</strong><span id="levelObjective">清除雾霾至 20</span></div>
          <div class="level-background" id="levelBackground" aria-hidden="true"></div>
          <div class="mist-layer" id="mistLayer" aria-hidden="true"></div>
          <div class="particle-layer" id="particleLayer" aria-hidden="true"></div>
          <div class="core" id="core" aria-label="清气吸附核">
            <div class="core-ring ring-outer"></div>
            <div class="core-ring ring-inner"></div>
            <div class="core-orb"><span class="core-symbol">◒</span></div>
            <div class="core-glow"></div>
          </div>
          <div class="field-hint" id="fieldHint"><span class="keycap">W</span><span class="keycap">A</span><span class="keycap">S</span><span class="keycap">D</span><span>移动清气核心</span></div>
          <div class="joystick" id="joystick" role="application" aria-label="触摸摇杆，拖动控制清气核心">
            <div class="joystick-base"><div class="joystick-knob" id="joystickKnob"></div></div>
            <span class="joystick-label">拖动移动</span>
          </div>
          <div class="toast" id="toast" role="status"></div>
        </div>
      </div>
    </section>
  </main>

  <audio id="backgroundMusic" src="雾散背景音乐.mp3" loop preload="auto" aria-hidden="true"></audio>

  <div class="intro-overlay visible" id="introOverlay" aria-hidden="false">
    <section class="intro-panel" role="dialog" aria-modal="true" aria-label="雾散荆州开场">
      <div class="intro-lead visible" id="introLead">
        <div class="intro-atmosphere" aria-hidden="true"></div>
        <div class="intro-lead-copy">
          <p class="intro-overline">JINGZHOU · AIR ACTION</p>
          <h2>荆州，曾经看得很远。</h2>
        </div>
      </div>
      <div class="intro-video-state" id="introVideoState" aria-hidden="true">
        <video id="introVideo" class="intro-video" autoplay muted preload="auto" playsinline aria-label="荆州序幕视频"></video>
        <button class="intro-skip" id="introSkip" type="button">跳过开场</button>
        <div class="intro-video-hint" id="introVideoHint" aria-hidden="true">点击画面播放声音</div>
      </div>
      <div class="intro-end-state" id="introEndState" aria-hidden="true">
        <div class="intro-end-copy">
          <p class="intro-overline">JINGZHOU IS WAITING</p>
          <h2>雾霾笼罩荆州</h2>
          <p>风景正在等待重新清晰。</p>
          <button class="primary-button" id="beginClean" type="button">开始清雾</button>
        </div>
      </div>
    </section>
  </div>

  <div class="video-overlay" id="videoOverlay" aria-hidden="true">
    <section class="video-panel" role="dialog" aria-modal="true" aria-label="景点宣传视频">
      <div class="video-kicker" id="videoKicker">景点宣传视频</div>
      <div class="video-placeholder">
        <video id="promoVideo" class="promo-video" autoplay preload="auto" playsinline aria-label="景点宣传视频"></video>
      </div>
      <div class="video-end-state" id="videoEndState" aria-hidden="true">
        <button class="primary-button" id="videoContinue">回到总地图，开始下一步探索</button>
      </div>
    </section>
  </div>

  <script src="game.js"></script>
</body>
</html>
