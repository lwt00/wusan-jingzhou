<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>荆州守将 · 交替行走 Demo</title><style>body{margin:0;background:#ece6d6;color:#34473e;font-family:serif}main{max-width:960px;margin:24px auto;padding:16px}canvas{display:block;width:100%;background:#f6f1e5;border:1px solid #bcad89}nav{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0}button,select{padding:9px;background:#fff7e7;border:1px solid #ac9060;color:inherit;font:inherit}p{line-height:1.7}#status{min-height:30px}</style></head><body><main><h1>荆州守将 · 左右脚交替行走</h1><p>完整原画帧预览：保持人物整体外观，以迈步、收拢的交替观感为主。尚未接入正式游戏。</p><canvas id="stage" width="720" height="480" aria-label="守将左右脚轮流迈步的动画"></canvas><nav><button id="play">暂停</button><button id="prev">上一帧</button><button id="next">下一帧</button><button id="reset">重新播放</button><label>节奏 <select id="fps"><option value="8">8 FPS</option><option value="2">2 FPS 慢速</option></select></label><label><input id="labels" type="checkbox" checked>显示帧号</label></nav><p id="status" role="status"></p><p>当前直接播放整个人物，不再拼接腿和靴子。原图动作仍有姿态差异，重点观察整体连贯性。</p><a href="journey-demo.html">返回正常游戏</a></main><script src="guard-walk-demo.js"></script></body></html>
