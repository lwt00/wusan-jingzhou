<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雾散荆州 · 四境同卷</title><link rel="icon" href="assets/demo-seal.svg"><link rel="stylesheet" href="journey-demo.css"></head>
<body><main><div id="stage" role="img" aria-label="关羽祠、宾阳楼、张居正故居和荆州博物馆同时呈现的动态文化探索全景"><p id="loading">正在展开荆州全景…</p></div>
<header><p class="eyebrow">荆楚文化探索 · 首页全景实验</p><h1>雾散荆州</h1><p>四境同卷，一步一程。</p></header>
<div class="demo-note">AI 艺术化插画 · 非实景路线<br>博物馆为艺术示意，待实景校准</div>
<footer><div class="journey-route"><span id="count">已模拟通关 0/4</span><div class="route-track"><div id="route-fill"></div></div><ol id="route"></ol></div>
<nav aria-label="演示控制"><button id="go" disabled>模拟通关：关羽祠</button><button id="replay" disabled>重新开始演示</button><button id="skip" disabled>跳过行进</button><p id="status" role="status" aria-live="polite">准备全景</p></nav><p class="note">独立流程演示 · 通关后人物前进，四站全景保持不变 · 不读取或写入正式存档</p></footer>
<section id="defense-game" class="game-shell" aria-hidden="true" aria-label="宾阳楼·烽火守城">
  <div class="game-panel" role="dialog" aria-modal="true" aria-labelledby="game-title">
    <button id="game-close" class="game-close" aria-label="退出关卡">×</button>
    <div class="game-heading"><div><p class="game-kicker">第二境 · 城墙守护</p><h2 id="game-title">烽火守城</h2><p id="game-instruction">拦截护城河上的敌船，别让它们抵达城门。</p></div><div class="game-stats"><span>波次 <b id="wave-value">1/3</b></span><span>城防 <b id="wall-value">3</b></span><span>军功 <b id="score-value">0</b></span></div></div>
    <div id="battlefield" class="battlefield">
      <div class="distant-bank" aria-hidden="true"></div><div class="city-wall" aria-hidden="true"><span class="tower tower-left"></span><span class="gate"></span><span class="tower tower-right"></span></div>
      <div class="river-label">护城河 · 点击敌船拦截</div><div id="boats" class="boats" aria-label="敌船区域"></div>
      <div id="beacon-zone" class="beacon-zone" aria-label="烽火传讯区域"></div>
      <div id="battle-message" class="battle-message" role="status" aria-live="polite"></div>
    </div>
    <div class="game-actions"><button id="game-start">开始守城</button><button id="game-retry" hidden>重新挑战</button><p>每波拦截完成后，依次点燃烽火台传讯。</p></div>
  </div>
</section>
</main><script src="vendor/pixi-8.6.6.min.js"></script><script src="journey-demo.js"></script></body></html>
