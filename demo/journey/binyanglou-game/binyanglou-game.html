<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>宾阳楼 · 烽火守城</title>
  <link rel="stylesheet" href="binyanglou-game.css">
</head>
<body>
  <main class="game" aria-labelledby="game-title">
    <header class="game-header">
      <div>
        <p class="eyebrow">宾阳楼 · 城墙守护</p>
        <h1 id="game-title">烽火守城</h1>
        <p id="instruction">点击护城河上的敌船进行拦截，别让它们抵达城门。</p>
      </div>
      <div class="stats" aria-label="对局数据">
        <span>波次 <b id="wave-value">1/3</b></span>
        <span>城防 <b id="wall-value">3</b></span>
        <span>军功 <b id="score-value">0</b></span>
      </div>
    </header>

    <section id="battlefield" class="battlefield" aria-label="宾阳楼守城战场">
      <div class="sky"><span class="sun"></span><i></i><i></i><i></i></div>
      <div class="mountains" aria-hidden="true"></div>
      <div class="wall" aria-hidden="true">
        <div class="battlement"></div><div class="tower tower-one"><span></span></div>
        <div class="gate"><b>宾阳楼</b></div><div class="tower tower-two"><span></span></div>
      </div>
      <div class="river"><span>护城河 · 点击敌船拦截</span></div>
      <div id="boats" class="boats" aria-label="敌船区域"></div>
      <div id="beacons" class="beacons" aria-label="烽火传讯区域"></div>
      <div id="message" class="message" role="status" aria-live="polite"></div>
    </section>

    <footer class="controls">
      <button id="start-button">开始守城</button>
      <button id="retry-button" hidden>重新挑战</button>
      <p><b>守城要领</b>每波拦截完成后，按数字顺序点燃烽火台。</p>
    </footer>
  </main>
  <script src="binyanglou-game.js"></script>
</body>
</html>
